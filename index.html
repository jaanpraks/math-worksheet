<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orbit · Math worksheet</title></head>
<body><button id="fullscreen" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">⤢</button><header><div><strong>Orbit</strong><span> A free-form math worksheet</span></div><nav aria-label="Worksheet tools"><button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button><button id="add-math">+ Math</button><button id="add-text">+ Text</button><button id="add-plot">+ Plot</button><button id="add-slider">+ Slider</button><button id="add-radio">+ Options</button><button id="add-image">+ Image</button><button id="add-section">+ Section</button><button id="save">Save JSON</button><button id="load">Load JSON</button></nav></header><aside>Click anywhere and type math · End with = to show an answer · Space turns writing into text · Enter inserts space · Ctrl/Cmd-click or drag blank paper to select · Hover for controls</aside><main id="viewport"><div id="canvas" aria-label="Worksheet canvas"></div></main><footer id="status" role="status">Ready</footer><input id="file" type="file" accept="application/json,.json" hidden><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><script type="module" src="/src/main.js"></script></body></html>
